<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Edge Scanner NG</title>
  <desc id="desc">A dark trading dashboard with live candlesticks, momentum lines, and scanner alerts</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d98a"/>
      <stop offset="0.55" stop-color="#42a5ff"/>
      <stop offset="1" stop-color="#8b7dff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14243a" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0c1728" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#2d8cff" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#2d8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="chartClip"><rect x="650" y="120" width="820" height="286" rx="16"/></clipPath>
    <pattern id="grid" width="82" height="58" patternUnits="userSpaceOnUse">
      <path d="M82 0H0V58" fill="none" stroke="#7791b1" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="28" fill="url(#glow)"/>
  <path d="M0 418C235 348 336 498 557 420S913 281 1138 355s311 34 462-41v206H0Z" fill="#0a2a35" opacity="0.33"/>
  <path d="M0 454C250 396 356 514 576 448s364-141 572-62 324 17 452-32v166H0Z" fill="#102c4d" opacity="0.38"/>

  <g transform="translate(92 91)">
    <g filter="url(#softGlow)">
      <path d="M12 76 47 41l34 34 51-60" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m111 15 21 0 0 21" fill="none" stroke="#8b7dff" stroke-width="9" stroke-linecap="round"/>
    </g>
    <text x="0" y="148" fill="#f4f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="750" letter-spacing="-2">EDGE SCANNER</text>
    <text x="0" y="208" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="6.5">NEXT GENERATION</text>
    <text x="2" y="260" fill="#9fb2cc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="1.6">LOCAL-FIRST • REAL-TIME • COMPOSABLE</text>

    <g transform="translate(0 304)">
      <rect width="174" height="48" rx="24" fill="#102e2a" stroke="#39d98a" stroke-opacity="0.55"/>
      <circle cx="26" cy="24" r="6" fill="#39d98a" filter="url(#softGlow)"/>
      <text x="44" y="31" fill="#c9ffe5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650">LIVE STREAM</text>
      <rect x="190" width="182" height="48" rx="24" fill="#10243d" stroke="#42a5ff" stroke-opacity="0.55"/>
      <path d="M218 17v14M211 24h14" stroke="#42a5ff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="238" y="31" fill="#d7ebff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650">YOUR SETUPS</text>
